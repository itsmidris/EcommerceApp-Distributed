spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.application.name=catalog-service

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===============================
# Server
# ===============================

server.port=8082
server.address=0.0.0.0


# ===============================
# Database
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# ===============================
# Product Image Storage
# ===============================

# local = store under uploads/products
# cloudinary = store in Cloudinary (used by deployment)
sellzon.storage.provider=${SELLZON_IMAGE_STORAGE:local}
sellzon.storage.image-dir=${SELLZON_IMAGE_DIR:uploads/products}

# Cloudinary credentials are supplied through environment variables in deployment.
sellzon.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
sellzon.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
sellzon.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# ===============================
# File Upload
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Identity Service
# ===============================

sellzon.services.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
# Development-only service-to-service authentication token. Move to Config Server/secret storage later.
sellzon.internal.service-token=sellzon-internal-dev-2026


# =====================================================
# Kafka
# =====================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer - Inventory Stock Events
spring.kafka.consumer.group-id=catalog-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=in.sellzon.catalog.kafka.event.InventoryStockChangedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=in.sellzon.catalog.kafka.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=read-only