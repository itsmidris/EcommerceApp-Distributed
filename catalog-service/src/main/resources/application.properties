spring.config.import=optional:configserver:http://localhost:8888

spring.application.name=catalog-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===============================
# Server
# ===============================

server.port=8082
server.address=0.0.0.0


# ===============================
# Database
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/catalog_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# ===============================
# Product Image Storage
# ===============================

sellzon.storage.image-dir=uploads/products


# ===============================
# File Upload
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Identity Service
# ===============================

sellzon.services.identity.base-url=http://localhost:8081
# Development-only service-to-service authentication token. Move to Config Server/secret storage later.
sellzon.internal.service-token=sellzon-internal-dev-2026


# =====================================================
# Kafka
# =====================================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer - Inventory Stock Events
spring.kafka.consumer.group-id=catalog-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=in.sellzon.catalog.kafka.event.InventoryStockChangedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=in.sellzon.catalog.kafka.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false

