<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/images/favicon.svg">
    <title>Sellzon | Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/customer.css">
</head>

<body>
    <header class="customer-navbar">
        <div class="container-fluid px-3 px-lg-4 py-2">
            <div class="d-flex align-items-center gap-3">
                <a class="brand" href="/customer/index.html">SELLZON</a>

                <form id="catalogSearchForm" class="flex-grow-1 search-box mx-auto" style="max-width:760px">
                    <div class="input-group">
                        <input id="catalogSearch" class="form-control" placeholder="Search products, brands...">
                        <button class="btn btn-dark">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <a class="btn btn-dark position-relative" href="/customer/cart.html">
                    <i class="bi bi-cart3"></i>
                    <span data-cart-count class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <div id="productDetail">
            <div class="text-center py-5">
                <div class="spinner-border"></div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/customer.js"></script>
    <script src="/js/customer-product-details.js"></script>
</body>

</html>
