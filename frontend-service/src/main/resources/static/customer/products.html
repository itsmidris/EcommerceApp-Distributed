<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/images/favicon.svg">
    <title>Sellzon | Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/customer.css">
</head>

<body>
    <header class="customer-navbar">
        <div class="container-fluid px-3 px-lg-4 py-2">
            <div class="d-flex align-items-center gap-3">
                <a class="brand" href="/customer/index.html">SELLZON</a>

                <form id="catalogSearchForm" class="flex-grow-1 search-box mx-auto" style="max-width:760px">
                    <div class="input-group">
                        <input id="catalogSearch" class="form-control" placeholder="Search products, brands...">
                        <button class="btn btn-dark">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>


                <div class="d-flex align-items-center gap-2">
                    <a id="loginLink"
                       class="btn btn-outline-dark btn-sm"
                       href="/customer/login.html">
                        Login
                    </a>

                    <a id="accountLink"
                       class="btn btn-outline-dark btn-sm d-none"
                       href="/customer/account.html">
                        <i class="bi bi-person-circle"></i>
                        Account
                    </a>
                </div>


                <a class="btn btn-dark position-relative" href="/customer/cart.html">
                    <i class="bi bi-cart3"></i>
                    <span data-cart-count class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">0</span>
                </a>
            </div>
        </div>

        <nav class="category-strip">
            <div class="container-fluid px-3 px-lg-4" id="categoryNav"></div>
        </nav>
    </header>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 mb-1">Products</h1>
                <p class="text-secondary mb-0">Browse active marketplace listings.</p>
            </div>
        </div>

        <div id="productsLoading" class="text-center py-5">
            <div class="spinner-border"></div>
        </div>

        <div id="productsEmpty" class="alert alert-light border d-none">
            No products matched your search.
        </div>

        <div id="productGrid" class="row g-3"></div>

        <nav class="mt-4">
            <ul id="pagination" class="pagination justify-content-center"></ul>
        </nav>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/customer.js"></script>
    <script src="/js/customer-products.js"></script>
</body>

</html>
