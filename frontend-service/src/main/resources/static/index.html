
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sellzon</title>
    <script>
        (function () {
            const host = window.location.hostname.toLowerCase();

            // Production portals
            if (host === "admin.sellzon.shop") {
                window.location.replace("/admin/login.html");
                return;
            }

            if (host === "partner.sellzon.shop") {
                window.location.replace("/partner/login.html");
                return;
            }

            // Local development portals
            if (host === "admin.localhost") {
                window.location.replace("/admin/index.html");
                return;
            }

            if (host === "partner.localhost") {
                window.location.replace("/partner/index.html");
                return;
            }

            // Customer storefront remains the default
            window.location.replace("/customer/index.html");
        })();
    </script>
</head>
<body></body>
</html>
