<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6C3CE1"/>
            <stop offset="100%" style="stop-color:#4A90D9"/>
        </linearGradient>
    </defs>

    <!-- Rounded Square Background -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#primaryGrad)"/>

    <!-- Shopping Cart Outline (negative space style) -->
    <rect x="28" y="44" width="48" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- Cart Wheels -->
    <circle cx="38" cy="76" r="6" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="38" cy="76" r="2" fill="#FFFFFF"/>
    <circle cx="62" cy="76" r="6" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="62" cy="76" r="2" fill="#FFFFFF"/>

    <!-- Cart Handle -->
    <path d="M 34 44 L 28 30 L 58 30 L 66 44" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Letter "S" overlaid -->
    <path d="M 48 18 C 38 18, 32 24, 32 30 C 32 36, 38 40, 48 42 C 58 44, 64 48, 64 54 C 64 60, 58 66, 48 66" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>

    <!-- Small dot accent -->
    <circle cx="48" cy="18" r="2.5" fill="#F7C948"/>
</svg>