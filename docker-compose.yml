services:

  # =======================================================
  # INFRASTRUCTURE
  # =======================================================

  redis:
    image: redis:7
    container_name: sellzon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sellzon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:4.0.0
    container_name: sellzon-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://kafka:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sellzon-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 15


  # =======================================================
  # SERVICE DISCOVERY
  # =======================================================

  eureka-server:
    build:
      context: ./eureka-server
    container_name: sellzon-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - sellzon-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/8761'"
        ]
      interval: 10s
      timeout: 5s
      retries: 15


  # =======================================================
  # CONFIG SERVER
  # =======================================================

  config-server:
    build:
      context: ./config-server
    container_name: sellzon-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/app/config-repo:ro
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - sellzon-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/8888'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  # =======================================================
  # IDENTITY SERVICE
  # =======================================================

  identity-service:
    build:
      context: ./identity-service
    container_name: sellzon-identity
    volumes:
      - /opt/sellzon/keys:/opt/sellzon/keys:ro
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      JWT_PRIVATE_KEY_PATH: file:/opt/sellzon/keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: file:/opt/sellzon/keys/public_key.pem
      DB_URL: ${IDENTITY_DB_URL}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - sellzon-network


  # =======================================================
  # CATALOG SERVICE
  # =======================================================

  catalog-service:
    build:
      context: ./catalog-service
    container_name: sellzon-catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_URL: ${CATALOG_DB_URL}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

      IDENTITY_SERVICE_URL: http://identity-service:8081

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      SELLZON_STORAGE_PROVIDER: ${SELLZON_STORAGE_PROVIDER}
      SELLZON_STORAGE_CLOUDINARY_CLOUD_NAME: ${SELLZON_STORAGE_CLOUDINARY_CLOUD_NAME}
      SELLZON_STORAGE_CLOUDINARY_API_KEY: ${SELLZON_STORAGE_CLOUDINARY_API_KEY}
      SELLZON_STORAGE_CLOUDINARY_API_SECRET: ${SELLZON_STORAGE_CLOUDINARY_API_SECRET}

      SELLZON_INTERNAL_SERVICE_TOKEN: ${SELLZON_INTERNAL_SERVICE_TOKEN}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sellzon-network


  # =======================================================
  # INVENTORY SERVICE
  # =======================================================

  inventory-service:
    build:
      context: ./inventory-service
    container_name: sellzon-inventory
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DB_URL: ${INVENTORY_DB_URL}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

      CATALOG_SERVICE_URL: http://catalog-service:8082

      IDENTITY_TOKEN_URI: http://identity-service:8081/oauth2/token

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      INVENTORY_OAUTH_CLIENT_ID: ${INVENTORY_OAUTH_CLIENT_ID}
      INVENTORY_OAUTH_CLIENT_SECRET: ${INVENTORY_OAUTH_CLIENT_SECRET}

      SELLZON_INTERNAL_SERVICE_TOKEN: ${SELLZON_INTERNAL_SERVICE_TOKEN}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # CART SERVICE
  # =======================================================

  cart-service:
    build:
      context: ./cart-service
    container_name: sellzon-cart
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CATALOG_SERVICE_URL: http://catalog-service:8082
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # ORDER SERVICE
  # =======================================================

  order-service:
    build:
      context: ./order-service
    container_name: sellzon-order
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_URL: ${ORDER_DB_URL}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

      IDENTITY_SERVICE_URL: http://identity-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      CART_SERVICE_URL: http://cart-service:8084

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # PAYMENT SERVICE
  # =======================================================

  payment-service:
    build:
      context: ./payment-service
    container_name: sellzon-payment
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DB_URL: ${PAYMENT_DB_URL}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

      ORDER_SERVICE_URL: http://order-service:8083

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # API GATEWAY
  # =======================================================

  api-gateway:
    build:
      context: ./api-gateway
    container_name: sellzon-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # FRONTEND
  # =======================================================

  frontend-service:
    build:
      context: ./frontend-service
    container_name: sellzon-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # ELASTICSEARCH
  # =======================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: sellzon-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - sellzon-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health > /dev/null"
        ]
      interval: 15s
      timeout: 10s
      retries: 20


  # =======================================================
  # LOGSTASH
  # =======================================================

  logstash:
    image: docker.elastic.co/logstash/logstash:9.1.4
    container_name: sellzon-logstash
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./monitoring/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - sellzon-network


  # =======================================================
  # KIBANA
  # =======================================================

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: sellzon-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - sellzon-network


  # =======================================================
  # PROMETHEUS
  # =======================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: sellzon-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      api-gateway:
        condition: service_started
    networks:
      - sellzon-network


  # =======================================================
  # GRAFANA
  # =======================================================

  grafana:
    image: grafana/grafana:latest
    container_name: sellzon-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - sellzon-network


# =========================================================
# VOLUMES
# =========================================================

volumes:
  redis-data:
  kafka-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:


# =========================================================
# NETWORK
# =========================================================

networks:
  sellzon-network:
    driver: bridge