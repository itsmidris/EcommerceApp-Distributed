spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.application.name=order-service

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Identity Service
sellzon.services.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}

# Catalog Service
sellzon.services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Cart Service
# Will be used after cart-service is created
sellzon.services.cart.base-url=${CART_SERVICE_URL:http://localhost:8084}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=read-only