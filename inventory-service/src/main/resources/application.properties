spring.application.name=inventory-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

sellzon.services.catalog.base-url=http://localhost:8082

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# =====================================================
# OAuth2 Client - Inventory Service -> Identity Service
# =====================================================

spring.security.oauth2.client.registration.inventory-service.provider=identity
spring.security.oauth2.client.registration.inventory-service.client-id=${INVENTORY_SERVICE_CLIENT_ID:inventory-service}
spring.security.oauth2.client.registration.inventory-service.client-secret=${INVENTORY_SERVICE_CLIENT_SECRET:change-this-inventory-secret}
spring.security.oauth2.client.registration.inventory-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.inventory-service.scope=catalog.internal,inventory.internal

spring.security.oauth2.client.provider.identity.token-uri=http://localhost:8081/oauth2/token


# =====================================================
# TEMPORARY LEGACY TOKEN
# Keep this for Inventory inbound calls from Order.
# We will remove it when Order -> Inventory is migrated.
# =====================================================

sellzon.internal.service-token=sellzon-internal-dev-2026

# =====================================================
# Kafka
# =====================================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=in.sellzon.inventory.kafka.event.ProductCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=in.sellzon.inventory.kafka.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka Producer - Inventory Service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO