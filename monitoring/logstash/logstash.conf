input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [service] {
    mutate {
      add_field => {
        "service_name" => "%{[service]}"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://host.docker.internal:9200"]
    index => "sellzon-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}