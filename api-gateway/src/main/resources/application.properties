# =========================================================
# CORS
# =========================================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:8080,http://partner.localhost:8080,http://admin.localhost:8080
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true


# =========================================================
# ACTUATOR
# =========================================================

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=read-only