spring.application.name=api-gateway

server.port=8000

# =========================================================
# EUREKA CLIENT
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =========================================================
# GATEWAY ROUTES
# Spring Cloud Gateway 5.x / Spring Boot 4.x
# Eureka Service Discovery + Load Balancing
# =========================================================


# -------------------------
# IDENTITY SERVICE
# -------------------------

spring.cloud.gateway.server.webflux.routes[0].id=identity-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=identity-users
spring.cloud.gateway.server.webflux.routes[1].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[2].id=identity-addresses
spring.cloud.gateway.server.webflux.routes[2].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/customer/addresses/**


