<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<title>Sellzon | Admin Google Login</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #eef3f9;
    color: #111;
}
.callback-box {
    background: #fff;
    padding: 45px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(25,45,75,.08);
}
.spinner {
    width: 36px;
    height: 36px;
    border: 4px solid #ddd;
    border-top-color: #6f98e8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 20px auto;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="callback-box">

<h2>Signing you in...</h2>

<div class="spinner"></div>

<p id="status">
Completing Google authentication.
</p>

</div>

<script src="/js/api.js"></script>
<script>
(async function () {

    const status =
        document.getElementById("status");

    const code =
        new URLSearchParams(
            window.location.search
        ).get("code");


    if (!code) {

        status.textContent =
            "Google sign-in failed: authorization code is missing.";

        return;
    }


    try {

        const response =
            await fetch(
                SellzonAPI.identityUrl("/api/auth/oauth2/exchange?code=" +
                encodeURIComponent(code)),
                {
                    method: "POST",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


        const contentType =
            response.headers.get("content-type") || "";


        const data =
            contentType.includes("application/json")
                ? await response.json()
                : null;


        if (!response.ok) {

            throw new Error(
                data?.message ||
                "Google sign-in failed."
            );
        }


        SellzonAPI.saveAuth(data);


        window.location.replace(
            "/index.html"
        );


    } catch (error) {

        status.textContent =
            error.message;

    }

})();
</script>

</body>
</html>
