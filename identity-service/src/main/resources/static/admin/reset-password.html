<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <title>Sellzon | Admin Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

<main class="auth-shell">
    <section class="auth-card">

        <div class="auth-form-side">
            <div class="form-content">

                <div class="mobile-brand">SELLZON</div>

                <h2>Reset Password</h2>

                <div id="authAlert" class="alert d-none" role="alert"></div>

                <div id="otpSection">

                    <p class="auth-helper">
                        Enter the 6-digit OTP sent to your email.
                    </p>

                    <div class="otp-container">

                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="OTP digit 1">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" aria-label="OTP digit 2">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" aria-label="OTP digit 3">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" aria-label="OTP digit 4">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" aria-label="OTP digit 5">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" aria-label="OTP digit 6">

                    </div>

                    <button
                            type="button"
                            class="btn auth-primary-btn"
                            id="verifyOtpBtn">
                        Verify OTP
                        <span
                                class="spinner-border spinner-border-sm d-none"
                                id="verifyOtpSpinner">
                    </span>
                    </button>

                </div>

                <div id="newPasswordSection" class="d-none">

                    <p class="auth-helper">
                        Choose a new password for your account.
                    </p>

                    <div class="input-group auth-input">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                        <input
                                id="newPassword"
                                type="password"
                                class="form-control"
                                placeholder="New Password"
                                maxlength="100"
                                autocomplete="new-password">

                        <button
                                type="button"
                                class="btn password-toggle"
                                data-password-target="newPassword"
                                aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <div class="input-group auth-input">

                <span class="input-group-text">
                    <i class="bi bi-shield-lock"></i>
                </span>

                        <input
                                id="resetConfirmPassword"
                                type="password"
                                class="form-control"
                                placeholder="Confirm New Password"
                                maxlength="100"
                                autocomplete="new-password">

                        <button
                                type="button"
                                class="btn password-toggle"
                                data-password-target="resetConfirmPassword"
                                aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <button
                            type="button"
                            class="btn auth-primary-btn"
                            id="resetPasswordBtn">
                        Reset Password
                        <span
                                class="spinner-border spinner-border-sm d-none"
                                id="resetPasswordSpinner">
    </span>
                    </button>

                </div>

            </div>
        </div>

        <div class="auth-panel auth-panel-right">
            <div class="panel-content">

                <div class="brand-mark">S</div>

                <h1>Welcome Back!</h1>

                <p>Reset your password securely.</p>

            </div>
        </div>

    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
