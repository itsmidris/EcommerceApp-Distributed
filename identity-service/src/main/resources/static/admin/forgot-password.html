<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <title>Sellzon | Admin Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

<main class="auth-shell">
    <section class="auth-card">

        <div class="auth-form-side">
            <div class="form-content">

                <div class="mobile-brand">SELLZON</div>

                <h2>Forgot Password?</h2>

                <p class="auth-helper">
                    Enter your email and we'll send you a 6-digit OTP.
                </p>

                <div id="authAlert" class="alert d-none" role="alert"></div>

                <form id="forgotPasswordForm" novalidate>

                    <div class="input-group auth-input">
                        <input
                                id="forgotEmail"
                                type="email"
                                class="form-control"
                                placeholder="Enter your Email"
                                autocomplete="email">
                    </div>

                    <button
                            type="submit"
                            class="btn auth-primary-btn"
                            id="forgotBtn">
                        Send OTP
                        <span
                                class="spinner-border spinner-border-sm d-none"
                                id="forgotSpinner">
                    </span>
                    </button>

                </form>

                <p class="mobile-switch" style="display:block;">
                    Remember your password?
                    <a href="/admin/login.html">Login</a>
                </p>

            </div>
        </div>

        <div class="auth-panel auth-panel-right">
            <div class="panel-content">
                <div class="brand-mark">S</div>
                <h1>Secure Account</h1>
                <p>We'll help you get back into your Sellzon account.</p>
            </div>
        </div>

    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
