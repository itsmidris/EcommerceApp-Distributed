<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sellzon Admin</title><link rel="icon" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom px-4 py-3">
    <strong>SELLZON ADMIN PANEL</strong>
    <div class="d-flex align-items-center gap-3">
        <span id="adminEmail" class="text-secondary"></span>
        <a class="btn btn-outline-primary btn-sm" href="/admin/categories.html">
            Categories
        </a>
        <button data-logout class="btn btn-outline-dark btn-sm">
            Logout
        </button>
    </div>
</nav>

<main class="container py-5">
    <div class="bg-white rounded-4 shadow-sm p-5">
        <h1>Admin Dashboard</h1>
        <p class="text-secondary">Central administration portal.</p>
        <div class="row g-3 mt-3">
            <div class="col-md-4"><a href="/admin/categories.html" class="text-decoration-none">
                <div class="border rounded-4 p-4">
                    <h5>Categories</h5>
                    <p class="text-secondary mb-0">Manage the four-level hierarchy.</p>
                </div>
            </a>
            </div>
            <div class="col-md-4">
                <a href="/admin/attributes.html" class="text-decoration-none">
                    <div class="border rounded-4 p-4">
                        <h5>Attributes</h5>
                        <p class="text-secondary mb-0">
                            Manage reusable product attributes and options.
                        </p>
                    </div>
                </a>
            </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded-4 p-4">
                    <h5>Users</h5>
                    <p class="text-secondary mb-0">Coming next.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>if(SellzonAPI.requireRole("ADMIN")){document.getElementById("adminEmail").textContent=SellzonAPI.getUser()?.email||"";}</script>
</body></html>
