<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <title>Sellzon | Customer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

<main class="auth-shell">
    <section class="auth-card">

        <div class="auth-panel auth-panel-left">
            <div class="panel-content">
                <div class="brand-mark">S</div>
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <a href="/customer/register.html" class="btn btn-outline-light auth-outline-btn">Sign Up</a>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="form-content">

                <div class="mobile-brand">SELLZON</div>

                <h2>Login</h2>

                <div id="authAlert" class="alert d-none" role="alert"></div>

                <form id="loginForm" novalidate>

                    <div class="input-group auth-input">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                        <input
                                id="email"
                                type="email"
                                class="form-control"
                                placeholder="Email"
                                autocomplete="email">
                    </div>

                    <div class="input-group auth-input">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                        <input
                                id="password"
                                type="password"
                                class="form-control"
                                placeholder="Password"
                                autocomplete="current-password">
                        <button
                                type="button"
                                class="btn password-toggle"
                                data-password-target="password"
                                aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <div class="forgot-row">
                        <a href="/customer/forgot-password.html" class="forgot-link">
                            Forgot Password?
                        </a>
                    </div>

                    <button
                            type="submit"
                            class="btn auth-primary-btn"
                            id="loginBtn">
                        Login
                        <span
                                class="spinner-border spinner-border-sm d-none"
                                id="loginSpinner">
                </span>
                    </button>

                </form>

                <div class="social-divider">
                    or login with
                </div>

                <div class="social-buttons">
                    <button
                            type="button"
                            class="social-btn"
                            title="Continue with Google"
                            onclick="window.location.href=SellzonAPI.identityUrl('/oauth2/authorization/google')">
                        <span class="google-icon">G</span>
                    </button>
                </div>

                <p class="mobile-switch">
                    Don't have an account?
                    <a href="/customer/register.html">Sign Up</a>
                </p>

            </div>
        </div>

    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
