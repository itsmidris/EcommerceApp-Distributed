<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
 <defs>
  <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:#6C3CE1"/>
   <stop offset="100%" style="stop-color:#4A90D9"/>
  </linearGradient>
 </defs>

 <!-- Background shape -->
 <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#primaryGrad)" opacity="0.08"/>

 <!-- Bold "S" -->
 <path d="M 62 18
           C 72 18, 76 24, 76 30
           C 76 36, 70 40, 62 42
           L 38 48
           C 30 50, 24 54, 24 60
           C 24 66, 28 72, 38 72
           L 62 72"
       fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

 <!-- Shopping cart wheel integrated -->
 <circle cx="62" cy="74" r="5" fill="none" stroke="#F7C948" stroke-width="3.5"/>
 <circle cx="62" cy="74" r="2" fill="#F7C948"/>

 <circle cx="40" cy="74" r="5" fill="none" stroke="#F7C948" stroke-width="3.5"/>
 <circle cx="40" cy="74" r="2" fill="#F7C948"/>

 <!-- Cart handle on "S" -->
 <path d="M 38 42 L 38 34 L 62 34" fill="none" stroke="#F7C948" stroke-width="3.5" stroke-linecap="round"/>

 <!-- Price tag dot -->
 <circle cx="76" cy="18" r="4" fill="#F7C948"/>
</svg>