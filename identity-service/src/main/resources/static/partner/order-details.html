<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sellzon Partner - Order Details</title>
    <link rel="icon" href="/images/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/partner-products.css">
    <link rel="stylesheet" href="/css/partner-orders.css">
</head>
<body class="partner-page">
<div class="container-fluid min-vh-100">
    <div class="row min-vh-100">
        <aside class="col-lg-2 d-none d-lg-flex flex-column border-end bg-white p-0">
            <div class="p-4 border-bottom">
                <a href="/partner/dashboard.html" class="text-decoration-none fw-bold fs-4 text-dark">SELLZON</a>
                <div class="small text-secondary mt-1">Partner Center</div>
            </div>
            <nav class="p-3 flex-grow-1">
                <a href="/partner/dashboard.html" class="partner-nav-link"><i class="bi bi-grid-1x2 me-2"></i>Dashboard</a>
                <a href="/partner/products.html" class="partner-nav-link"><i class="bi bi-box-seam me-2"></i>Products</a>
                <a href="/partner/orders.html" class="partner-nav-link active"><i class="bi bi-bag-check me-2"></i>Orders</a>
                <a href="/partner/inventory.html" class="partner-nav-link"><i class="bi bi-boxes me-2"></i>Inventory</a>
            </nav>
            <div class="p-3 border-top">
                <button type="button" class="sidebar-logout" data-logout>
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>
        <main class="col-lg-10 col-12 p-0">
            <header class="px-4 py-3 border-bottom bg-white d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-secondary small">Partner Center</div>
                    <h1 class="h4 mb-0">Order details</h1>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a href="/partner/orders.html" class="btn btn-outline-dark btn-sm">Back to Orders</a>
                    <span id="sellerName" class="small fw-semibold"></span>
                </div>
            </header>
            <section class="p-4">
                <div id="orderRoot">
                    <div class="text-center py-5">
                        <div class="spinner-border"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/partner-order-details.js"></script>
</body>
</html>
