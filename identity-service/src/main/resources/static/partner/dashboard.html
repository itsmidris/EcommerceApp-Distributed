<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sellzon Partner Center</title>
    <link rel="icon" href="/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom px-4 py-3">
    <strong>SELLZON PARTNER CENTER</strong>
    <div class="d-flex align-items-center gap-3">
        <span id="partnerEmail" class="text-secondary"></span>
        <button data-logout class="btn btn-outline-dark btn-sm">Logout</button>
    </div>
</nav>
<main class="container py-5">
    <div class="bg-white rounded-4 shadow-sm p-5">
        <h1>Seller Dashboard</h1>
        <p class="text-secondary">Welcome to Partner Center.</p>
        <div class="row g-3 mt-3">
            <div class="col-md-4">
                <div class="border rounded-4 p-4">
                    <h5>Products</h5>
                    <p class="text-secondary mb-3">Manage your product listings.</p>
                    <a href="/partner/products.html" class="btn btn-outline-primary btn-sm">Manage Products</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded-4 p-4">
                    <h5>Orders</h5>
                    <p class="text-secondary mb-3">View and process your customer orders.</p>
                    <a href="/partner/orders.html" class="btn btn-outline-primary btn-sm">Manage Orders</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded-4 p-4">
                    <h5>Inventory</h5>
                    <p class="text-secondary mb-0">Inventory module</p>
                    <a href="/partner/inventory.html" class="btn btn-outline-primary btn-sm">Manage Inventory</a>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    if (SellzonAPI.requireRole("SELLER")) {
      document.getElementById("partnerEmail").textContent = SellzonAPI.getUser()?.email || "";
    }
</script>
</body>
</html>
